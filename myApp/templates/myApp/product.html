{% extends 'myApp/base.html' %}
{% block content %}

<div class="container py-5">
    <div class="card border-0 shadow-sm mb-4">
        <div class="row g-0">
            <div class="col-md-4">
                <img src="{{ product.image.url }}" class="img-fluid rounded-start h-100 object-fit-cover" alt="{{ product.name }}">
            </div>
            <div class="col-md-8">
                <div class="card-body p-4">
                    <h3 class="card-title fw-bold mb-1">{{ product.name }}</h3>
                    <p class="text-muted mb-3">{{ product.description }}</p>
                    <h4 class="fw-bold mb-4" style="color: #6f42c1;">R{{ product.price }}</h4>

                    <div class="row align-items-center g-3 mb-4">
                        <div class="col-auto">
                            <label class="form-label fw-semibold mb-0">Quantity</label>
                        </div>
                        <div class="col-auto">
                            <div class="input-group" style="width: 130px;">
                                <button class="btn btn-outline-secondary btn-sm" id="qty-minus" type="button">−</button>
                                <input type="number" class="form-control form-control-sm text-center" id="qty-input" value="1" min="1" max="99">
                                <button class="btn btn-outline-secondary btn-sm" id="qty-plus" type="button">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">← Back</a>
                        <button type="button" value="{{ product.id }}" class="btn btn-secondary" id="add-c">
                            <i class="bi bi-cart-plus me-1"></i> Add to Cart
                        </button>
                    </div>

                    <!-- Feedback message -->
                    <div id="cart-feedback" class="mt-3" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Quantity +/- buttons
$('#qty-minus').on('click', function() {
    var val = parseInt($('#qty-input').val()) || 1;
    if (val > 1) $('#qty-input').val(val - 1);
});
$('#qty-plus').on('click', function() {
    var val = parseInt($('#qty-input').val()) || 1;
    $('#qty-input').val(val + 1);
});

// Add to cart
$('#add-c').on('click', function(e) {
    e.preventDefault();
    var productId = $(this).val();
    var quantity = parseInt($('#qty-input').val()) || 1;

    $.ajax({
        type: 'POST',
        url: '{% url "addcart_add" %}',
        data: {
            product_id: productId,
            quantity: quantity,
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'
        },
        success: function(json) {
            // Update navbar badge
            document.getElementById('cart_quantity').textContent = json.qty;
            // Show inline feedback
            $('#cart-feedback')
                .removeClass('alert-danger')
                .addClass('alert alert-success')
                .html('<i class="bi bi-check-circle me-1"></i> Added to cart! (<strong>' + json.qty + '</strong> item(s) total)')
                .show();
        },
        error: function(xhr, errmsg, err) {
            $('#cart-feedback')
                .removeClass('alert-success')
                .addClass('alert alert-danger')
                .html('Something went wrong. Please try again.')
                .show();
        }
    });
});
</script>
{% endblock %}
