{% extends 'myApp/base.html' %}
{% block content %}

<header class="page-header text-white text-center">
    <div class="container">
        <h1 class="display-4 fw-bold mb-2">Welcome Back</h1>
        <p class="lead text-white-50">Log in to your account</p>
    </div>
</header>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4" style="border-radius:16px;">
                <h4 class="fw-bold text-center mb-4">Login</h4>
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" name="username" placeholder="Enter your username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" name="password" placeholder="Enter your password">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-ft btn-lg fw-semibold" style="border-radius:50px;">Login</button>
                    </div>
                </form>
                <hr class="my-4">
                <p class="text-center text-muted small mb-0">
                    Don't have an account? <a href="{% url 'register' %}" style="color:#6f42c1; font-weight:600;">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
