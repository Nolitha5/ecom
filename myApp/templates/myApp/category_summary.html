{% extends 'myApp/base.html' %}
{% block content %}

<header class="page-header text-white text-center">
    <div class="container">
        <h1 class="display-4 fw-bold mb-2">Shop by Category</h1>
        <p class="lead text-white-50">Find exactly what you're looking for</p>
    </div>
</header>

<section class="py-5">
    <div class="container">
        <div class="row g-4 justify-content-center">
            {% for category in categories %}
            <div class="col-md-5">
                <a href="{% url 'category' category %}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm text-center p-4" style="border-radius:16px; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 8px 24px rgba(111,66,193,0.2)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
                        <div class="mb-3" style="font-size:2.5rem;">
                            {% if 'Women' in category %}👗{% elif 'Men' in category %}👔{% else %}🛍️{% endif %}
                        </div>
                        <h4 class="fw-bold mb-1" style="color:#6f42c1;">{{ category }}</h4>
                        <p class="text-muted small mb-0">Browse collection →</p>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
